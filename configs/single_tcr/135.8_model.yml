general:
  name: 135.8_single_tcr
  description: 135.8_pretrain_finetune_esm

data:
  data_path: data/ASdata-all/135.8_neg=rnd234c0_pos=rnd4c5.csv
  batch_size: 8

model:
  pretrained_weights: vdjdb-pretrained-ckpt/pretrained-checkpoint.ckpt
  use_pos_weight: true
  encoder_dim: 1280
  freeze_encoder: false
  esm_weights: esm/esm2_t33_650M_UR50D.pt
  patience: 10
  lr: 1.e-6
  weight_decay: 1.e-6
  epochs: 1000
  seed: 1
  precision: bf16
  device_num: [0,1]
  strategy: ddp
  tb_logger_path: model_outputs/
  tb_logger_folder: single_tcr/
  wandb_project: tcr-specificity # if you want to use wandb to log
  version_name: 135.8_finetune_esm
